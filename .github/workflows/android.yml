name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build debug APK
        env:
          ORG_GRADLE_PROJECT_FIT50_FIREBASE_API_KEY: ${{ secrets.FIT50_FIREBASE_API_KEY }}
          ORG_GRADLE_PROJECT_FIT50_FIREBASE_APP_ID: ${{ secrets.FIT50_FIREBASE_APP_ID }}
          ORG_GRADLE_PROJECT_FIT50_FIREBASE_PROJECT_ID: ${{ secrets.FIT50_FIREBASE_PROJECT_ID }}
          ORG_GRADLE_PROJECT_FIT50_GOOGLE_WEB_CLIENT_ID: ${{ secrets.FIT50_GOOGLE_WEB_CLIENT_ID }}
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fit50-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
