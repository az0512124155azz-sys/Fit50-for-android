<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fit50+ · ספריית תרגילים</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14251d;color:#f5f3e8;font:17px system-ui,sans-serif}header{padding:28px 5vw;border-bottom:1px solid #405446;display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0 0 8px}p{line-height:1.65;color:#c5d0c7;margin:8px 0}small{color:#c5d0c7}main{max-width:1450px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(290px,1fr) minmax(360px,1.1fr);gap:28px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #526859;background:#223b2d;color:inherit}input{min-width:180px;flex:1}button{cursor:pointer}button:hover{border-color:#d4e85c}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d4e85c;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.list{display:grid;gap:10px;max-height:72vh;overflow:auto;padding:4px}.item{text-align:right;display:flex;justify-content:space-between;align-items:center;gap:12px}.item[aria-pressed=true]{border-color:#d4e85c;background:#354b30}.item strong{display:block;font-size:17px}.badge{font-size:12px;border:1px solid #697d60;padding:4px 8px;border-radius:30px;white-space:nowrap;color:#d4e85c}.detail{background:#20372c;border:1px solid #465f4e;border-radius:22px;padding:22px;align-self:start;position:sticky;top:20px}h2{margin:0 0 8px}.exercise-coach-card{height:390px;background:radial-gradient(ellipse at center,#3f5c44,#20372c 75%);border-radius:18px;overflow:hidden}.exercise-coach-canvas{display:block;width:100%;height:100%}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.primary{background:#d4e85c;color:#14251d;border:0;font-weight:700}#status{min-height:28px;color:#d4e85c}#notice{font-size:14px}#details{padding:12px 0;border-bottom:1px solid #465f4e}.coach-dialog{width:min(90vw,700px);height:85vh;background:#20372c;border:1px solid #697d60;border-radius:22px;color:#fff}.coach-dialog::backdrop{background:#000b}.coach-dialog canvas{height:100%;width:100%}.coach-close,.coach-pause{position:absolute;z-index:2}.coach-close{top:10px;right:10px}.coach-pause{bottom:12px;left:calc(50% - 25px)}.coach-title{position:absolute;top:15px;left:70px;right:70px;text-align:center}#error{color:#ffb3a6}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}.detail{position:static;grid-row:1}.exercise-coach-card{height:300px}.list{max-height:50vh}header{padding:20px}h1{font-size:24px}}
</style>
<header><div><h1>ספריית התרגילים של Fit50+</h1><p>בוחרים תרגיל, רואים את התנועה ומוסיפים לפרויקט.</p></div><span class="badge" id="count"></span></header>
<main><section aria-label="רשימת תרגילים"><div class="filters"><input id="search" type="search" placeholder="חיפוש תרגיל או קבוצת שרירים" aria-label="חיפוש"><select id="filter" aria-label="סינון"><option value="all">כל הספרייה</option><option value="available">זמינים להוספה</option><option value="active">באפליקציה</option><option value="warmup">חימום</option><option value="main">תרגילים עיקריים</option><option value="cooldown">הרפיה ומתיחות</option></select></div><div class="list" id="list"></div><p id="empty" hidden>לא נמצאו תרגילים מתאימים.</p></section>
<section class="detail" aria-label="תצוגת תרגיל"><h2 id="exName">טוען את הספרייה…</h2><p id="subtitle"></p><div class="exercise-coach-card"><canvas id="preview" class="exercise-coach-canvas" aria-label="הדגמה תלת ממדית"></canvas></div><div class="actions"><button id="pause">השהה הדגמה</button><button id="restart">התחל מהתחלה</button></div><div id="details"></div><p id="safety"></p><p id="variant"></p><div class="actions"><button id="activate" class="primary" disabled>הוסף לאפליקציה</button></div><div id="status" role="status" aria-live="polite"></div><p id="error" role="alert"></p><p id="notice">צפה במחזור מלא לפני ההוספה. הכפתור שומר את הבחירה בקובצי הפרויקט במחשב; היא תיכלל בגרסת האפליקציה הבאה שתיבנה מהם. העלאה ל־GitHub מתבצעת בנפרד. הכלי אינו יוצר APK.</p></section></main>
<script src="/coach.js"></script><script>
let data,selected,busy=false;const $=id=>document.getElementById(id);const coach=new Fit50ExerciseCoach3D($('preview'));
const enabled=e=>e.kind==='base'||data.active.includes(e.id);
function render(){const query=$('search').value.trim().toLocaleLowerCase(),filter=$('filter').value;const items=data.all.filter(e=>(e.name+' '+e.muscle+' '+e.id).toLocaleLowerCase().includes(query)).filter(e=>filter==='all'||filter==='active'&&enabled(e)||filter==='available'&&!enabled(e)||e.phase===filter);
 $('list').replaceChildren();$('empty').hidden=items.length>0;$('count').textContent=data.all.length+' פריטים · '+data.all.filter(enabled).length+' באפליקציה';
 for(const e of items){const button=document.createElement('button');button.className='item';button.setAttribute('aria-pressed',String(e.id===selected?.id));const text=document.createElement('span'),title=document.createElement('strong'),sub=document.createElement('small'),badge=document.createElement('span');title.textContent=e.name;sub.textContent=e.muscle;text.append(title,sub);badge.className='badge';badge.textContent=enabled(e)?'באפליקציה':'זמין להוספה';button.append(text,badge);button.onclick=()=>select(e);$('list').append(button);}
 if(selected){$('activate').disabled=busy||selected.kind==='base';$('activate').textContent=selected.kind==='base'?'תרגיל בסיס · כבר באפליקציה':enabled(selected)?'הסר מהתוספות':'הוסף לאפליקציה';}
}
function select(e){selected=e;$('exName').textContent=e.name;$('subtitle').textContent=e.muscle;coach.setExercise(e.id);$('pause').textContent='השהה הדגמה';$('details').textContent=({reps:'חזרות',hold:'תרגיל לפי זמן',breath:'נשימה'}[e.type]||e.type)+' · רמת קושי '+e.difficulty;$('safety').textContent=e.safety;$('variant').textContent=e.kind==='tempo-variant'?'גרסה איטית של תנועה קיימת — 70% מהקצב המקורי.':'תנועה מהקטלוג הקיים. התצוגה מאפשרת לבדוק אם ההדגמה ברורה ומתאימה.';$('status').textContent='';$('error').textContent='';render();}
$('search').oninput=render;$('filter').onchange=render;
$('pause').onclick=()=>{coach.paused=!coach.paused;$('pause').textContent=coach.paused?'הפעל הדגמה':'השהה הדגמה';};$('restart').onclick=()=>{coach.setExercise(selected.id);coach.time=0;coach.paused=false;$('pause').textContent='השהה הדגמה';};
$('activate').onclick=async()=>{if(busy||!selected)return;const entry=selected;busy=true;render();$('error').textContent='';$('status').textContent='שומר ומעדכן את קובצי הפרויקט…';try{const response=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json','X-Library-Token':data.token},body:JSON.stringify({id:entry.id,enabled:!enabled(entry)})});const result=await response.json();if(!response.ok)throw Error(result.error);data=result;$('status').textContent=entry.name+': '+result.message;}catch(error){$('error').textContent=error.message;$('status').textContent='';}finally{busy=false;render();}};
fetch('/api/library').then(r=>{if(!r.ok)throw Error('לא ניתן לטעון את הספרייה');return r.json();}).then(result=>{data=result;select(data.all.find(e=>e.id==='ankle_circle')||data.all[0]);}).catch(error=>$('error').textContent=error.message);
</script></html>
