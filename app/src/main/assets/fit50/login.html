<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1F2B24">
  <title>Fit50+ — התחברות</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1F2B24;
      --forest-2: #2D3D33;
      --cream: #FAF7F2;
      --cream-2: #F2EDE4;
      --ink: #1A1A1A;
      --ink-2: #4A4A4A;
      --ink-3: #8A8A8A;
      --line: rgba(26,26,26,.12);
      --accent: #E85A2C;
      --accent-2: #C44A22;
      --lime: #D4E85C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      font-family: 'Assistant', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      direction: rtl;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cream);
    }

    /* ==== HERO ==== */
    .hero {
      background: var(--forest);
      color: var(--cream);
      padding: 48px 32px 56px;
      border-radius: 0 0 36px 36px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,90,44,.25), transparent 70%);
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,232,92,.12), transparent 70%);
      pointer-events: none;
    }

    /* ==== LOGO ==== */
    .brand-logo {
      display: flex;
      align-items: flex-start;
      direction: ltr;
      line-height: 1;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .brand-logo .fit {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: 54px;
      letter-spacing: -0.04em;
      color: var(--cream);
      line-height: 0.85;
    }

    .brand-logo .fifty {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 62px;
      letter-spacing: -0.05em;
      color: var(--accent);
      line-height: 0.85;
      margin-left: 1px;
    }

    .brand-logo .plus {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--cream);
      line-height: 1;
      margin-top: 4px;
      margin-left: 3px;
    }

    .brand-tagline {
      font-size: 16px;
      font-weight: 400;
      color: rgba(250,247,242,.7);
      line-height: 1.5;
      max-width: 280px;
      position: relative;
      z-index: 1;
    }

    /* ==== FORM ==== */
    .form-section {
      flex: 1;
      padding: 40px 32px 32px;
      display: flex;
      flex-direction: column;
    }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .btn-google {
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      background: #FFFFFF;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all .15s;
      box-shadow: 0 2px 8px -4px rgba(0,0,0,.06);
      margin-bottom: 24px;
    }

    .btn-google:hover {
      background: #FAFAFA;
      border-color: rgba(26,26,26,.2);
      box-shadow: 0 4px 12px -4px rgba(0,0,0,.1);
    }

    .btn-google:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-google.loading {
      pointer-events: none;
      opacity: .7;
    }

    .btn-google svg { width: 22px; height: 22px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink-3);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 8px;
      letter-spacing: .01em;
    }

    .field-input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      min-height: 56px;
      padding: 16px 18px;
      background: var(--cream-2);
      border: 1.5px solid transparent;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      transition: all .15s;
    }

    .field input::placeholder {
      color: var(--ink-3);
      font-weight: 400;
    }

    /* ===== FIX 1: פלייסהולדר עברי בשדה LTR ===== */
    /* כשהשדה הוא LTR אבל הטקסט placeholder בעברית -
       מיישר אותו לימין ונותן לו RTL */
    .field input[dir="ltr"]::placeholder {
      direction: rtl;
      text-align: right;
    }

    .field input:focus {
      outline: none;
      background: #FFFFFF;
      border-color: var(--forest);
      box-shadow: 0 0 0 4px rgba(31,43,36,.08);
    }

    .field input[dir="ltr"] {
      text-align: left;
    }

    #passIn {
      padding-left: 78px;
      padding-right: 18px;
    }

    .btn-primary {
      width: 100%;
      min-height: 58px;
      padding: 18px 24px;
      background: var(--forest);
      color: var(--cream);
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      box-shadow: 0 8px 20px -8px rgba(31,43,36,.5);
    }

    .btn-primary:hover {
      background: var(--forest-2);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px -4px rgba(31,43,36,.4);
    }

    .btn-primary:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== FIX 2: שורת הקישורים - מסודרת וממורכזת ===== */
    .link-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .link {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      padding: 4px 6px;
      letter-spacing: .01em;
    }

    .link:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .link-muted {
      color: var(--ink-2);
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    /* ==== TOAST ==== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--forest);
      color: var(--cream);
      padding: 14px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 32px -8px rgba(0,0,0,.4);
      z-index: 1000;
      transition: transform .35s cubic-bezier(.22,1.4,.4,1);
      pointer-events: none;
      max-width: calc(100% - 48px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--accent);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .legal {
      text-align: center;
      margin-top: auto;
      padding-top: 24px;
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.6;
    }

    .legal a {
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1px;
      cursor: pointer;
    }

    .pass-toggle {
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      min-width: 56px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--cream-2);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      padding: 0 10px;
      color: var(--ink-2);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      z-index: 2;
    }

    .pass-toggle:hover { color: var(--ink); }

    @media (max-height: 700px) {
      .hero { padding: 32px 32px 40px; }
      .brand-logo .fit { font-size: 44px; }
      .brand-logo .fifty { font-size: 50px; }
      .brand-logo .plus { font-size: 20px; }
      .form-section { padding: 28px 32px 20px; }
    }
  </style>
  <script src="i18n.js"></script>
</head>
<body>

<div class="screen">
  <div class="hero">
    <h1 class="brand-logo">
      <span class="fit">Fit</span><span class="fifty">50</span><span class="plus">+</span>
    </h1>
    <p class="brand-tagline">כושר, תנועה ואיזון לאנשים שחיים את הגיל הזה.</p>
  </div>

  <div class="form-section">
    <h2 class="form-title">ברוך הבא</h2>

    <button class="btn-google" id="googleBtn">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      <span>המשך עם Google</span>
    </button>

    <div class="divider">או</div>

    <div class="field">
      <label>אימייל</label>
      <div class="field-input-wrap">
        <input type="email" id="emailIn" placeholder="you@example.com" dir="ltr" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label>סיסמה</label>
      <div class="field-input-wrap">
        <input type="password" id="passIn" placeholder="לפחות 6 תווים" dir="ltr" autocomplete="current-password">
        <button class="pass-toggle" id="passToggle" type="button">הצג</button>
      </div>
    </div>

    <button class="btn-primary" id="loginBtn">
      <span>התחברות</span>
    </button>

    <div class="link-row">
      <button class="link" id="forgotBtn">שכחתי סיסמה</button>
      <span class="link-muted">
        אין חשבון? <button class="link" id="registerBtn">הירשם</button>
      </span>
    </div>

    <div class="legal">
      לפני השימוש מומלץ לעיין ב<a id="termsLink" href="legal.html?doc=terms&amp;from=login">תנאי השימוש והבטיחות</a> וב<a id="privacyLink" href="legal.html?doc=privacy&amp;from=login">מדיניות הפרטיות</a>.
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastT;
function toast(msg, isError) {
  const t = $('toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 3000);
}
$('passToggle').onclick = () => {
  const inp = $('passIn');
  const btn = $('passToggle');
  if (inp.type === 'password') { inp.type='text'; btn.textContent='הסתר'; }
  else { inp.type='password'; btn.textContent='הצג'; }
};
</script>


<script>
(function(){
  var googleWatchdog=null;
  var googleButtonHtml='';

  function nativeCall(name){
    if(!window.Fit50Native || typeof window.Fit50Native[name] !== 'function') return false;
    var args=[].slice.call(arguments,1);
    try{ window.Fit50Native[name].apply(window.Fit50Native,args); return true; }catch(e){ return false; }
  }

  window.fit50NativeResult=function(action,ok,message,destination){
    if(action==='google'){
      clearTimeout(googleWatchdog);
      googleWatchdog=null;
    }
    var t=document.getElementById('toast');
    if(t){
      t.textContent=message||'';
      t.className='toast show'+(ok?'':' error');
      setTimeout(function(){t.classList.remove('show')},3000);
    }
    var loginBtn=document.getElementById('loginBtn');
    if(loginBtn){loginBtn.disabled=false;loginBtn.innerHTML='<span>התחברות</span>';}
    var googleBtn=document.getElementById('googleBtn');
    if(googleBtn){
      googleBtn.disabled=false;
      googleBtn.classList.remove('loading');
      if(googleButtonHtml) googleBtn.innerHTML=googleButtonHtml;
    }
    if(ok && (action==='login'||action==='google')){
      var next=(destination==='home'?'home':'questionnaire')+'.html';
      setTimeout(function(){location.href=next},350);
    }
  };

  function bind(){
    var loginBtn=document.getElementById('loginBtn');
    var googleBtn=document.getElementById('googleBtn');
    var forgotBtn=document.getElementById('forgotBtn');
    var registerBtn=document.getElementById('registerBtn');

    if(loginBtn) loginBtn.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();
      var email=(document.getElementById('emailIn')||{}).value||'';
      var pass=(document.getElementById('passIn')||{}).value||'';
      if(!email.includes('@')) return toast('נא להזין כתובת אימייל תקינה',true);
      if(pass.length<6) return toast('הסיסמה חייבת להכיל לפחות 6 תווים',true);
      if(!window.Fit50Native) return toast('שירות ההתחברות אינו זמין',true);
      loginBtn.disabled=true;
      loginBtn.innerHTML='<span class="spinner"></span><span>מתחבר...</span>';
      nativeCall('login',email.trim(),pass);
    },true);

    if(googleBtn) googleBtn.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();
      if(!window.Fit50Native) return toast('Google Sign-In אינו זמין',true);
      googleButtonHtml=googleBtn.innerHTML;
      googleBtn.disabled=true;
      googleBtn.classList.add('loading');
      googleBtn.innerHTML='<span class="spinner"></span><span>פותח את Google...</span>';
      if(!nativeCall('googleSignIn')){
        window.fit50NativeResult('google',false,'לא ניתן לפתוח כרגע את החיבור עם Google');
        return;
      }
      clearTimeout(googleWatchdog);
      googleWatchdog=setTimeout(function(){
        window.fit50NativeResult('google',false,'Google לא הגיב. בדקו ש-Google Play Services מעודכן ונסו שוב.');
      },30000);
    },true);

    if(forgotBtn) forgotBtn.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();
      location.href='forgot.html';
    },true);

    if(registerBtn) registerBtn.addEventListener('click',function(e){
      e.preventDefault();e.stopImmediatePropagation();
      location.href='register.html';
    },true);
  }

  function continueExistingSession(){
    if(window.Fit50Native && typeof window.Fit50Native.continueSignedInSession==='function'){
      try{ window.Fit50Native.continueSignedInSession(); }catch(e){}
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){
      bind();
      setTimeout(continueExistingSession,120);
    });
  }else{
    bind();
    setTimeout(continueExistingSession,120);
  }

  window.addEventListener('focus',function(){
    setTimeout(continueExistingSession,180);
  });
})();
</script>
</body>
</html>
