<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1F2B24">
  <title>Fit50+ — איפוס סיסמה</title>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1F2B24;
      --forest-2: #2D3D33;
      --cream: #FAF7F2;
      --cream-2: #F2EDE4;
      --ink: #1A1A1A;
      --ink-2: #4A4A4A;
      --ink-3: #8A8A8A;
      --line: rgba(26,26,26,.12);
      --accent: #E85A2C;
      --accent-2: #C44A22;
      --lime: #D4E85C;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      font-family: 'Assistant', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      direction: rtl;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      user-select: none;
    }

    .screen {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--cream);
    }

    /* ==== HERO ==== */
    .hero {
      background: var(--forest);
      color: var(--cream);
      padding: 48px 32px 56px;
      border-radius: 0 0 36px 36px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -40px;
      right: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,90,44,.25), transparent 70%);
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,232,92,.12), transparent 70%);
      pointer-events: none;
    }

    /* ==== LOGO ==== */
    .brand-logo {
      display: flex;
      align-items: flex-start;
      direction: ltr;
      line-height: 1;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .brand-logo .fit {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 500;
      font-size: 54px;
      letter-spacing: -0.04em;
      color: var(--cream);
      line-height: 0.85;
    }

    .brand-logo .fifty {
      font-family: 'Fraunces', serif;
      font-weight: 900;
      font-size: 62px;
      letter-spacing: -0.05em;
      color: var(--accent);
      line-height: 0.85;
      margin-left: 1px;
    }

    .brand-logo .plus {
      font-family: 'Frank Ruhl Libre', serif;
      font-weight: 700;
      font-size: 26px;
      color: var(--cream);
      line-height: 1;
      margin-top: 4px;
      margin-left: 3px;
    }

    .brand-tagline {
      font-size: 16px;
      font-weight: 400;
      color: rgba(250,247,242,.7);
      line-height: 1.5;
      max-width: 280px;
      position: relative;
      z-index: 1;
    }

    /* ==== FORM ==== */
    .form-section {
      flex: 1;
      padding: 40px 32px 32px;
      display: flex;
      flex-direction: column;
    }

    .form-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .btn-google {
      width: 100%;
      min-height: 58px;
      padding: 16px 20px;
      background: #FFFFFF;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all .15s;
      box-shadow: 0 2px 8px -4px rgba(0,0,0,.06);
      margin-bottom: 24px;
    }

    .btn-google:hover {
      background: #FAFAFA;
      border-color: rgba(26,26,26,.2);
      box-shadow: 0 4px 12px -4px rgba(0,0,0,.1);
    }

    .btn-google:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-google.loading {
      pointer-events: none;
      opacity: .7;
    }

    .btn-google svg { width: 22px; height: 22px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--ink-3);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      margin-bottom: 8px;
      letter-spacing: .01em;
    }

    .field-input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      min-height: 56px;
      padding: 16px 18px;
      background: var(--cream-2);
      border: 1.5px solid transparent;
      border-radius: 14px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      transition: all .15s;
    }

    .field input::placeholder {
      color: var(--ink-3);
      font-weight: 400;
    }

    /* ===== FIX 1: פלייסהולדר עברי בשדה LTR ===== */
    /* כשהשדה הוא LTR אבל הטקסט placeholder בעברית -
       מיישר אותו לימין ונותן לו RTL */
    .field input[dir="ltr"]::placeholder {
      direction: rtl;
      text-align: right;
    }

    .field input:focus {
      outline: none;
      background: #FFFFFF;
      border-color: var(--forest);
      box-shadow: 0 0 0 4px rgba(31,43,36,.08);
    }

    .field input[dir="ltr"] {
      text-align: left;
    }

    .btn-primary {
      width: 100%;
      min-height: 58px;
      padding: 18px 24px;
      background: var(--forest);
      color: var(--cream);
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      box-shadow: 0 8px 20px -8px rgba(31,43,36,.5);
    }

    .btn-primary:hover {
      background: var(--forest-2);
    }

    .btn-primary:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px -4px rgba(31,43,36,.4);
    }

    .btn-primary:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== FIX 2: שורת הקישורים - מסודרת וממורכזת ===== */
    .link-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
    }

    .link {
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      padding: 4px 6px;
      letter-spacing: .01em;
    }

    .link:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .link-muted {
      color: var(--ink-2);
      font-weight: 500;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    /* ==== TOAST ==== */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--forest);
      color: var(--cream);
      padding: 14px 24px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 12px 32px -8px rgba(0,0,0,.4);
      z-index: 1000;
      transition: transform .35s cubic-bezier(.22,1.4,.4,1);
      pointer-events: none;
      max-width: calc(100% - 48px);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--accent);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .legal {
      text-align: center;
      margin-top: auto;
      padding-top: 24px;
      font-size: 12px;
      color: var(--ink-3);
      line-height: 1.6;
    }

    .legal a {
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 1px;
      cursor: pointer;
    }

    .pass-toggle {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      color: var(--ink-3);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
    }

    .pass-toggle:hover { color: var(--ink); }

    @media (max-height: 700px) {
      .hero { padding: 32px 32px 40px; }
      .brand-logo .fit { font-size: 44px; }
      .brand-logo .fifty { font-size: 50px; }
      .brand-logo .plus { font-size: 20px; }
      .form-section { padding: 28px 32px 20px; }
    }
  </style>
</head><body>
<div class="screen">
  <div class="hero">
    <h1 class="brand-logo">
      <span class="fit">Fit</span><span class="fifty">50</span><span class="plus">+</span>
    </h1>
    <p class="brand-tagline">איפוס מאובטח דרך כתובת האימייל של החשבון.</p>
  </div>

  <div class="form-section">
    <h2 class="form-title">שכחת סיסמה?</h2>

    <div class="field">
      <label>אימייל החשבון</label>
      <div class="field-input-wrap">
        <input type="email" id="emailIn" placeholder="you@example.com" dir="ltr" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label>הגיל שלך</label>
      <div class="field-input-wrap">
        <input type="number" id="ageIn" placeholder="לדוגמה 52" min="40" max="120" inputmode="numeric">
      </div>
    </div>

    <button class="btn-primary" id="resetBtn">
      <span>שלח קישור לאיפוס</span>
    </button>

    <div class="link-row" style="justify-content:center">
      <button class="link" id="backLogin">חזרה להתחברות</button>
    </div>

    <div class="legal">הגיל משמש כשכבת אימות נוספת בלבד. קישור האיפוס נשלח רק לתיבת האימייל של בעל החשבון, והסיסמה הנוכחית לעולם אינה מוצגת.</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let toastT;
function toast(msg,isError){
  const t=$('toast'); if(!t) return;
  t.textContent=msg||'';
  t.className='toast show'+(isError?' error':'');
  clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),3600);
}
window.fit50NativeResult=function(action,ok,message){
  if(action!=='reset') return;
  const btn=$('resetBtn');
  if(btn){btn.disabled=false;btn.innerHTML='<span>שלח קישור לאיפוס</span>';}
  toast(message || (ok?'בקשת האיפוס נשלחה':'שליחת האיפוס נכשלה'),!ok);
  if(ok){
    setTimeout(()=>{ $('resetBtn').innerHTML='<span>שלח שוב</span>'; },300);
  }
};
$('backLogin').onclick=()=>location.href='login.html';
$('resetBtn').onclick=function(){
  const email=$('emailIn').value.trim();
  const age=parseInt($('ageIn').value,10);
  if(!email.includes('@')) return toast('נא להזין כתובת אימייל תקינה',true);
  if(!Number.isInteger(age) || age<40 || age>120) return toast('נא להזין גיל תקין',true);
  if(!window.Fit50Native || typeof window.Fit50Native.resetPassword!=='function') return toast('שירות איפוס הסיסמה אינו זמין',true);
  this.disabled=true;this.innerHTML='<span class="spinner"></span><span>מאמת פרטים...</span>';
  try{ window.Fit50Native.resetPassword(email,age); }
  catch(e){ this.disabled=false;this.innerHTML='<span>שלח קישור לאיפוס</span>';toast('שליחת האיפוס נכשלה',true); }
};
</script>
</body></html>
