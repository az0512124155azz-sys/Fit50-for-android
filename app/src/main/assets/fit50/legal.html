<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1F2B24">
  <title>Fit50+ · מסמכים משפטיים</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#FAF7F2;color:#1A1A1A;font:17px/1.65 system-ui,sans-serif}
    header{background:#1F2B24;color:#FAF7F2;padding:22px 20px 24px}
    .top{max-width:720px;margin:auto;display:flex;align-items:center;gap:16px}
    button{font:inherit;cursor:pointer}
    #back{border:1px solid #79847b;border-radius:12px;background:transparent;color:inherit;padding:5px 14px}
    h1{font-size:25px;line-height:1.2;margin:0}
    main{max-width:720px;margin:auto;padding:20px 20px 90px}
    nav{display:flex;gap:10px;margin-bottom:20px}
    nav button{flex:1;border:1px solid #b8b9b2;border-radius:14px;padding:10px;background:#fff;color:#1F2B24}
    nav button.on{background:#1F2B24;color:#fff}
    section{background:#fff;border:1px solid #e5e2dc;border-radius:18px;padding:20px;margin-bottom:16px}
    h2{font-size:20px;margin:0 0 12px;color:#1F2B24}
    h3{font-size:18px;margin:22px 0 7px;color:#1F2B24}
    p{margin:10px 0} ul{margin:9px 0;padding-right:22px} li{margin:5px 0}
    .meta{font-size:13px;color:#67716a;margin:0 0 14px}
    .note{background:#eef2e5;border-right:4px solid #a4bc52;padding:12px 14px;border-radius:8px}
    a{color:#245b4a;overflow-wrap:anywhere}
  </style>
</head>
<body>
<header><div class="top"><button id="back" type="button">חזרה</button><h1>Fit50+ · מידע משפטי</h1></div></header>
<main>
  <nav aria-label="מסמכים"><button id="termsTab" type="button">תנאי שימוש ובטיחות</button><button id="privacyTab" type="button">מדיניות פרטיות</button></nav>
  <div id="document"></div>
</main>
<script>
const TERMS = `
<section>
  <p class="meta">עודכן: 23 בספטמבר 2026 · מפעיל: [שם המפעיל/ה, אדם פרטי או גוף רשום]</p>
  <h2>תנאי שימוש ובטיחות</h2>
  <p>Fit50+ היא אפליקציה לתכנון והצגת אימונים כלליים. השירות מופעל בידי [שם המפעיל/ה] ("המפעיל"). התנאים האלה מתארים את השימוש באפליקציה; מדיניות הפרטיות מתארת את עיבוד המידע.</p>
  <h3>1. למי השירות מיועד</h3>
  <p>האפליקציה מיועדת למבוגרים. התרגילים וההדגמות הם תוכן כללי, גם כאשר נבחרת תוכנית לפי תשובות לשאלון. אין באפליקציה השגחה בזמן אמת או בדיקה רפואית.</p>
  <h3>2. בריאות ובטיחות</h3>
  <p class="note">האפליקציה אינה רופא, פיזיותרפיסט או שירות חירום, ואינה מאבחנת, מטפלת או נותנת אישור רפואי להתאמן. המלצה או אפשרות להתחיל אימון באפליקציה אינן קובעות שהפעילות בטוחה לכל אדם.</p>
  <ul>
    <li>יש להשיב לשאלון במדויק ולעדכן תשובות שהשתנו. התאמת האימון תלויה במידע שנמסר ואינה יכולה לזהות כל סיכון.</li>
    <li>אם קיימת הנחיה רפואית להגביל פעילות, או שהאפליקציה מבקשת בירור מקצועי, יש לפעול לפי ההנחיה ולא לעקוף את חסימת האימון באמצעות שינוי תשובה שאינה נכונה.</li>
    <li>יש לבצע תרגילים בטווח נוח ובסביבה בטוחה, ולהשתמש בתמיכה יציבה לפי הצורך. יש להפסיק פעילות במקרה של כאב בחזה, קוצר נשימה חריג, סחרחורת, עילפון, כאב חד או תחושה חריגה; במצב דחוף יש לפנות לשירותי החירום.</li>
    <li>איש מקצוע רפואי שמכיר את מצבך יכול לתת הנחיות אישיות שגוברות על תוכן כללי באפליקציה.</li>
  </ul>
  <h3>3. חשבון ושימוש</h3>
  <p>יש למסור פרטים נכונים, לשמור על אמצעי הכניסה לחשבון ולא להשתמש באפליקציה כדי לפגוע בשירות או בזכויות אחרים. המפעיל רשאי לטפל בשימוש שפוגע באבטחה או מפר את התנאים, בכפוף לדין.</p>
  <h3>4. זמינות וקניין רוחני</h3>
  <p>השירות עשוי להשתנות או להיות לא זמין זמנית. אין התחייבות לזמינות רציפה. התכנים, העיצוב והקוד מוגנים לפי הדין; ניתנת הרשאה אישית ולא בלעדית להשתמש באפליקציה למטרתה.</p>
  <h3>5. אחריות</h3>
  <p>פעילות גופנית כרוכה בסיכונים ומשתמשים נדרשים להפעיל שיקול דעת ולפעול לפי הנחיות מקצועיות שניתנו להם. המפעיל אינו מבטיח תוצאה רפואית או כושר מסוימת, ואינו אחראי לנזק שנובע ממידע שגוי שנמסר על ידי המשתמש או משימוש בניגוד להוראות הבטיחות, ככל שהדין מאפשר זאת.</p>
  <p>אין בתנאים אלה כדי לשלול או להגביל אחריות שאי אפשר לשלול או להגביל לפי דין, לרבות אחריות לנזק גוף כשהדין אינו מאפשר פטור, או כדי לפגוע בזכויות צרכן מחייבות.</p>
  <h3>6. מחיקת חשבון ושינויים</h3>
  <p>ניתן לבקש מחיקת חשבון מתוך הגדרות האפליקציה. שינויים מהותיים בתנאים יוצגו לפני כניסתם לתוקף בדרך מתאימה; המשך שימוש כפוף לדין ולהודעה שניתנה.</p>
  <h3>7. דין וקשר</h3>
  <p>הדין הישראלי יחול ככל שהוא חל על השירות, בלי לגרוע מזכויות מחייבות לפי דין אחר. לפניות: [כתובת דוא"ל רשמית לפניות משפטיות ותמיכה].</p>
</section>`;
const PRIVACY = `
<section>
  <p class="meta">עודכן: 23 בספטמבר 2026 · בעל השליטה במידע: [שם המפעיל/ה, אדם פרטי או גוף רשום]</p>
  <h2>מדיניות פרטיות</h2>
  <p>מדיניות זו מסבירה איזה מידע Fit50+ מבקשת, למה, למי הוא מועבר ומה ניתן לעשות לגביו. מסירת חלק מהמידע היא בחירה שלך, אך ללא פרטי חשבון ושאלון לא ניתן להפעיל את ההתאמה האישית או לשמור התקדמות בחשבון.</p>
  <h3>1. המידע והמקור שלו</h3>
  <ul>
    <li><strong>חשבון:</strong> כתובת דוא"ל, שם ותמונת פרופיל אם ספק הכניסה מספק אותם, מזהה משתמש ונתוני אימות הנחוצים לכניסה.</li>
    <li><strong>שאלון והתאמה:</strong> גיל, מטרות, ניסיון, העדפות, ציוד, כאב, תסמינים, מצבים רפואיים, תרופות, הגבלות פעילות ותשובות נוספות שמסרת. זהו מידע רגיש.</li>
    <li><strong>פעילות באפליקציה:</strong> תוכנית שנבחרה, אימונים שבוצעו, משך והתקדמות, העדפות ותאריך פעילות.</li>
    <li><strong>נתונים טכניים:</strong> ספקי תשתית עשויים לעבד מזהי מכשיר, כתובת IP, נתוני אבטחה ושגיאות לצורך הפעלת השירות.</li>
  </ul>
  <h3>2. מטרות השימוש</h3>
  <p>ניהול החשבון, בחירת אימון מותאם, הצגת אזהרות וחסימות בטיחות לפי התשובות, שמירת התקדמות והעדפות, אבטחה וטיפול בתקלות ובפניות. החלטת ההתאמה והחסימה מחושבת אוטומטית לפי התשובות; ניתן לעדכן תשובות ולפנות אלינו לבירור. אין לראות בהחלטה אישור או אבחנה רפואית.</p>
  <h3>3. היכן המידע נשמר ולמי נמסר</h3>
  <p>נתוני חשבון, שאלון, העדפות והיסטוריית אימונים נשמרים ב־Google Firebase Authentication ו־Cloud Firestore, ובחלקם גם בעותק מקומי במכשיר כדי שהאפליקציה תפעל. נתוני שאלון הבריאות אינם נשמרים רק במכשיר. Google פועלת כספק תשתית לפי תנאיה; נתונים עשויים להיות מעובדים מחוץ לישראל לפי מיקום שירותי Google והגדרות הפרויקט.</p>
  <p>בעת כניסה באמצעות Google, Google מספקת לאפליקציה פרטי חשבון הדרושים לכניסה. שיתוף דוח התקדמות דרך מנגנון השיתוף של המכשיר נעשה רק ביוזמתך ויעביר את הקובץ ליעד שתבחר. מידע יימסר גם אם קיימת חובה חוקית לכך. האפליקציה אינה כוללת כיום רכיב פרסום או Analytics ייעודי בקוד שלה ואינה מוכרת את תשובות הבריאות למפרסמים.</p>
  <h3>4. שמירה ואבטחה</h3>
  <p>המידע נשמר כל עוד החשבון קיים ונחוץ למטרות שתוארו. אין כאן הבטחה לתקופת מחיקה קבועה שאינה מיושמת בקוד. בעת מחיקת חשבון מתוך האפליקציה מתבצעת בקשה למחיקת נתוני המשתמש והאימונים ב־Firestore ולמחיקת חשבון האימות; מידע שספק תשתית מחויב לשמור מטעמי דין, אבטחה או גיבוי עשוי להישמר לתקופה נוספת לפי מדיניותו. ההגנה נשענת על מנגנוני Android ו־Firebase, אך אין מערכת חסינה לחלוטין.</p>
  <h3>5. זכויות ובחירות</h3>
  <p>אפשר לעיין בתשובות ולעדכן אותן באפליקציה, ולבקש עיון, תיקון או מחיקה של מידע אישי בהתאם לדין החל. אפשר למחוק חשבון בהגדרות. לפנייה בנושא מידע, בקשה שאינה זמינה באפליקציה או דיווח על תקלה במחיקה: [כתובת דוא"ל רשמית לפניות פרטיות].</p>
  <h3>6. קטינים ושינויים</h3>
  <p>השירות מיועד למבוגרים ואינו מתוכנן לילדים. אם התברר שנאסף מידע מקטין בניגוד למטרה זו, ניתן לפנות לכתובת שלעיל. שינויים מהותיים במדיניות יוצגו באפליקציה לפני תחולתם בדרך מתאימה.</p>
</section>`;
const params = new URLSearchParams(location.search);
const from = ['login','home','settings','questionnaire'].includes(params.get('from')) ? params.get('from') : 'settings';
function show(kind) {
  const privacy = kind === 'privacy';
  document.getElementById('document').innerHTML = privacy ? PRIVACY : TERMS;
  document.getElementById('privacyTab').classList.toggle('on', privacy);
  document.getElementById('termsTab').classList.toggle('on', !privacy);
  document.title = (privacy ? 'מדיניות פרטיות' : 'תנאי שימוש') + ' · Fit50+';
  history.replaceState(null, '', '?doc=' + (privacy ? 'privacy' : 'terms') + '&from=' + from);
}
document.getElementById('back').onclick = () => { location.href = from + '.html'; };
document.getElementById('privacyTab').onclick = () => show('privacy');
document.getElementById('termsTab').onclick = () => show('terms');
show(params.get('doc'));
</script>
</body>
</html>
