const params = new URLSearchParams(location.search);
const from = ['login','register','home','settings','questionnaire'].includes(params.get('from')) ? params.get('from') : 'settings';
function show(kind) {
  const privacy = kind === 'privacy';
  document.getElementById('document').innerHTML = privacy ? PRIVACY : TERMS;
  document.getElementById('privacyTab').classList.toggle('on', privacy);
  document.getElementById('termsTab').classList.toggle('on', !privacy);
  document.title = (privacy ? 'מדיניות פרטיות' : 'תנאי שימוש') + ' · Fit50+';
  history.replaceState(null, '', '?doc=' + (privacy ? 'privacy' : 'terms') + '&from=' + from);
}
document.getElementById('back').onclick = () => { location.href = from + '.html'; };
document.getElementById('privacyTab').onclick = () => show('privacy');
document.getElementById('termsTab').onclick = () => show('terms');
show(params.get('doc'));
</script>
