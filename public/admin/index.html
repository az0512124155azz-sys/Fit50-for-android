<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fit50+ Admin</title>
<style>
:root{--forest:#1F2B24;--cream:#FAF7F2;--accent:#E85A2C;--lime:#D4E85C;--ink:#1A1A1A;--muted:#777;--line:#ded8ce}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);font-family:Arial,sans-serif;color:var(--ink)}
.shell{max-width:1120px;margin:auto;padding:32px 20px 60px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
.brand{font-size:30px;font-weight:900;direction:ltr}.brand b{color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px rgba(31,43,36,.05)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}
.ghost{background:#eee9e0}.google{background:#fff;border:1px solid var(--line)}
.hidden{display:none!important}.sub{color:var(--muted);line-height:1.5}
.status{padding:12px 14px;background:#f4f0e8;border-radius:12px;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.stat strong{display:block;font-size:34px;line-height:1;margin-bottom:8px}.stat span{color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#44610d;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#7fa61f;box-shadow:0 0 0 4px rgba(127,166,31,.15)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-weight:600}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:700}
.firebase_accepted{background:#e8f5d0;color:#486318}.send_error{background:#fde0d9;color:#9d3218}.admin_accepted{background:#e5edf8}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="brand"><span>Fit</span><b>50</b><span>+</span></div>
      <div class="sub">Admin Monitor · עדכון אוטומטי בזמן אמת</div>
    </div>
    <div>
      <button id="loginBtn" class="google">התחבר עם Google</button>
      <button id="logoutBtn" class="ghost hidden">התנתק</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2 style="margin:0 0 6px">סטטוס מערכת</h2>
        <div id="authStatus" class="sub">לא מחובר</div>
      </div>
      <div id="liveState" class="live hidden"><span class="dot"></span> LIVE</div>
    </div>
  </div>

  <div id="adminArea" class="hidden">
    <div class="stats">
      <div class="stat"><strong id="statTotal">0</strong><span>בקשות איפוס</span></div>
      <div class="stat"><strong id="statToday">0</strong><span>היום</span></div>
      <div class="stat"><strong id="statOk">0</strong><span>אושרו ע"י Firebase</span></div>
      <div class="stat"><strong id="statErrors">0</strong><span>שגיאות</span></div>
    </div>

    <div class="card" style="margin-top:18px">
      <div class="row" style="justify-content:space-between">
        <div>
          <h2 style="margin:0 0 6px">בקשות איפוס סיסמה</h2>
          <div class="sub">אין צורך לרענן או ללחוץ על שום דבר. הרשימה מתעדכנת אוטומטית.</div>
        </div>
      </div>

      <div style="overflow:auto;margin-top:14px">
        <table>
          <thead>
            <tr><th>זמן</th><th>אימייל</th><th>מקור</th><th>מצב</th><th>שגיאה</th></tr>
          </thead>
          <tbody id="requestsBody">
            <tr><td colspan="5" class="empty">ממתין לנתונים...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/__/firebase/10.14.1/firebase-app-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-auth-compat.js"></script>
<script src="/__/firebase/10.14.1/firebase-firestore-compat.js"></script>
<script src="/__/firebase/init.js"></script>
<script>
const ADMIN_EMAIL='az0512124155azz@gmail.com';
const auth=firebase.auth();
const db=firebase.firestore();
const $=id=>document.getElementById(id);
let unsubscribe=null;

function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}

$('loginBtn').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{
  $('authStatus').textContent=e.message;
});
$('logoutBtn').onclick=()=>auth.signOut();

auth.onAuthStateChanged(async user=>{
  if(unsubscribe){unsubscribe();unsubscribe=null;}

  const allowed=!!user && String(user.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase();
  $('loginBtn').classList.toggle('hidden',!!user);
  $('logoutBtn').classList.toggle('hidden',!user);
  $('adminArea').classList.toggle('hidden',!allowed);
  $('liveState').classList.toggle('hidden',!allowed);

  if(!user){
    $('authStatus').textContent='לא מחובר';
    return;
  }
  if(!allowed){
    $('authStatus').textContent='החשבון '+user.email+' אינו מורשה.';
    await auth.signOut();
    return;
  }

  $('authStatus').textContent='מחובר כמנהל: '+user.email;
  startLiveMonitor();
});

function startLiveMonitor(){
  unsubscribe=db.collection('passwordResetRequests')
    .orderBy('createdAt','desc')
    .limit(200)
    .onSnapshot(snapshot=>{
      const items=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
      render(items);
    },error=>{
      $('requestsBody').innerHTML='<tr><td colspan="5" class="empty">שגיאת Firestore: '+esc(error.message)+'</td></tr>';
    });
}

function render(items){
  const todayKey=new Date().toDateString();
  const today=items.filter(x=>x.createdAt?.toDate && x.createdAt.toDate().toDateString()===todayKey).length;
  const ok=items.filter(x=>x.status==='firebase_accepted'||x.status==='admin_accepted').length;
  const errors=items.filter(x=>x.status==='send_error').length;

  $('statTotal').textContent=items.length;
  $('statToday').textContent=today;
  $('statOk').textContent=ok;
  $('statErrors').textContent=errors;

  if(!items.length){
    $('requestsBody').innerHTML='<tr><td colspan="5" class="empty">אין עדיין בקשות איפוס.</td></tr>';
    return;
  }

  $('requestsBody').innerHTML=items.map(x=>{
    const when=x.createdAt?.toDate ? x.createdAt.toDate().toLocaleString('he-IL') : 'ממתין...';
    return '<tr>'+
      '<td>'+esc(when)+'</td>'+
      '<td dir="ltr">'+esc(x.email)+'</td>'+
      '<td>'+esc(x.source)+'</td>'+
      '<td><span class="badge '+esc(x.status)+'">'+esc(x.status)+'</span></td>'+
      '<td>'+esc(x.error||'—')+'</td>'+
    '</tr>';
  }).join('');
}
</script>
</body>
</html>
